[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mimic-tear"
version = "0.1.0"
description = "Mimic Tear"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dxcam; platform_system == 'Windows'",
    "grad-cam>=1.5.5",
    "numpy",
    "opencv-python",
    "pyarrow>=20",
    "pyyaml>=6",
    "torch",
    "pytest",
    "pydantic>=2",
]

[project.optional-dependencies]
native = ["pybind11"]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["mimic_tear*"]

[tool.ruff]
line-length = 88
target-version = "py311"
